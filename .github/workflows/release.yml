name: Build & Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 🚀 Build & Release macOS
    runs-on: macos-latest

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🔧 Install dependencies
        run: pnpm install

      # ── Build ──────────────────────────────────────────────────────────────

      - name: 🏗️ Build all packages (webui + deemix + gui)
        run: pnpm turbo build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔖 Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/gui/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── Package ────────────────────────────────────────────────────────────

      - name: ⚡ Package Electron app
        run: pnpm --filter deemix-gui exec electron-forge package

      - name: 🔐 Ad-hoc codesign
        run: |
          codesign --deep --force --sign - \
            "packages/gui/out/Deemix-darwin-arm64/Deemix.app"

      # ── Artifacts ──────────────────────────────────────────────────────────

      - name: 🗜️ Create ZIP for auto-updater
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "packages/gui/out/Deemix-darwin-arm64/Deemix.app" \
            "nicolai-deemix.${{ steps.version.outputs.version }}.zip"

      - name: 📋 Generate latest-mac.yml (auto-updater manifest)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="nicolai-deemix.${VERSION}.zip"
          SIZE=$(stat -f%z "$ZIP")
          SHA512=$(openssl dgst -sha512 -binary "$ZIP" | base64)
          RELEASEDATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${ZIP}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${ZIP}
          sha512: ${SHA512}
          releaseDate: '${RELEASEDATE}'
          EOF
          echo "Generated latest-mac.yml:"
          cat latest-mac.yml

      - name: 💿 Create DMG installer
        run: |
          brew install create-dmg
          VERSION="${{ steps.version.outputs.version }}"
          create-dmg \
            --volname "nicolai-deemix" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Deemix.app" 180 170 \
            --hide-extension "Deemix.app" \
            --app-drop-link 480 170 \
            "nicolai-deemix.${VERSION}.dmg" \
            "packages/gui/out/Deemix-darwin-arm64/"

      # ── Release ────────────────────────────────────────────────────────────

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            **${{ github.event.head_commit.message }}**

            Commit: ${{ github.sha }}
          files: |
            nicolai-deemix.${{ steps.version.outputs.version }}.dmg
            nicolai-deemix.${{ steps.version.outputs.version }}.zip
            latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
